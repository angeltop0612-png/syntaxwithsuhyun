    <script>
        // Chapter 05 49문장 전체 정밀 수록 완료
        const sentencesDb = [
            // UNIT 27
            { no: 284, unit: "UNIT 27", eng: "We live in an age of constant interaction.", struct: "We(S) + live(V) + [in an age of constant interaction](M)", grammar: "현재시제: 현재의 보편적인 주위 상태를 서술합니다.", words: "constant (끊임없는), interaction (상호작용)", kor: "우리는 끊임없는 상호작용의 시대에 살고 있다." },
            { no: 285, unit: "UNIT 27", eng: "He goes hiking every Saturday.", struct: "He(S) + goes hiking(V) + [every Saturday](M)", grammar: "현재시제: 규칙적으로 반복되는 습관 표현. go -ing는 '~하러 가다'의 뜻입니다.", words: "go hiking (등산 가다), every Saturday (토요일마다)", kor: "그는 토요일마다 등산을 간다." },
            { no: 286, unit: "UNIT 27", eng: "Most planets rotate in an anticlockwise direction.", struct: "Most planets(S) + rotate(V) + [in an anticlockwise direction](M)", grammar: "현재시제: 과학적 진리, 자연 법칙을 상술할 때는 항시 현재형입니다.", words: "planet (행성), rotate (자전하다, 회전하다), anticlockwise (반시계 방향의)", kor: "대부분의 행성은 반시계 방향으로 자전한다." },
            { no: 287, unit: "UNIT 27", eng: "Vegetarians stay away from meat, including chicken and fish.", struct: "Vegetarians(S) + stay away from(V) + meat(O) + [including chicken and fish](M)", grammar: "현재시제: 일반적인 사실 진술. including은 전치사화된 현재분사구입니다.", words: "vegetarian (채식주의자), stay away from (~을 멀리하다), including (~을 포함하여)", kor: "채식주의자들은 닭고기와 생선을 포함한 고기를 멀리한다." },
            { no: 288, unit: "UNIT 27", eng: "The new subway line opens next month.", struct: "The new subway line(S) + opens(V) + [next month](M)", grammar: "현재시제 대용: 공적으로 예정되어 확정된 미래 일정(스케줄)을 대변합니다.", words: "subway line (지하철 노선), open (개통하다)", kor: "새 지하철 노선은 다음 달에 개통한다." },
            { no: 289, unit: "UNIT 27", eng: "When you do common things in an uncommon way, you will get the attention of the world.", struct: "[When you(S) do(V) common things(O) in an uncommon way](시간부사절), you(S) + will get(V) + the attention(O)", grammar: "시간/조건 부사절: 시간의 부사절(When) 안에서는 미래시점일지라도 조동사 will 대신 현재시제(do)를 대용합니다.", words: "common (평범한), uncommon (비범한), attention (주목, 관심)", kor: "당신이 평범한 일들을 비범한 방식으로 할 때, 당신은 세상의 관심을 얻게 될 것이다." },
            { no: 290, unit: "UNIT 27", eng: "If you don’t go through hardships, you won‘t know how strong you are.", struct: "[If you(S) don’t go through(V) hardships(O)](조건부사절), you(S) + won‘t know(V) + [how strong(의) you(S') are(V')](O)", grammar: "시간/조건 부사절 & 간접의문문: 조건절 내부 현재시제 대용(don't go through) 및 know의 목적어로 사용된 [의+주+동] 어순의 간접의문문입니다.", words: "go through (겪다, 경험하다), hardship (고난, 역경)", kor: "만약 당신이 고난을 겪지 않는다면, 당신은 당신이 얼마나 강한지 알지 못할 것이다." },
            { no: 291, unit: "UNIT 27", eng: "As soon as you start to pursue a dream, everything in your life will have meaning.", struct: "[As soon as you(S) start(V) {to pursue a dream}(O)](시간부사절), everything [in your life](S) + will have(V) + meaning(O)", grammar: "시간/조건 부사절: '~하자마자'를 뜻하는 시간 부사절 접속사 As soon as 뒤에 현재시제(start)가 위치합니다.", words: "as soon as (~하자마자), pursue (추구하다), meaning (의미)", kor: "당신이 꿈을 추구하기 시작하자마자, 당신 삶의 모든 것은 의미를 갖게 될 것이다." },
            
            // UNIT 28
            { no: 292, unit: "UNIT 28", eng: "Respect yourself and others will respect you.", struct: "Respect(V) yourself(O) + and(접) + others(S) + will respect(V) + you(O)", grammar: "명령문 + and: '~해라, 그러면 ...할 것이다'의 양식으로 미래 예측 조건절을 대신합니다.", words: "respect (존중하다), yourself (너 자신)", kor: "너 자신을 존중해라, 그러면 다른 사람들도 너를 존중할 것이다." },
            { no: 293, unit: "UNIT 28", eng: "The successful man will profit from his mistakes and try again in a different way.", struct: "The successful man(S) + will profit(V1) + and + try(V2)", grammar: "미래 조동사 병렬: 조동사 'will' 뒤에 동사원형인 profit과 try가 등위접속사 and로 결합되어 있습니다.", words: "successful (성공적인), profit from (~으로부터 이득을 얻다), different (다른)", kor: "성공하는 사람은 자신의 실수로부터 배울 것이고 다른 방식으로 다시 시도할 것이다." },
            { no: 294, unit: "UNIT 28", eng: "This week I’m going to concentrate on schoolwork that I need to catch up on.", struct: "I(S) + ’m going to concentrate on(V) + schoolwork(O) + [that(목.관) I need to catch up on](M)", grammar: "be going to 미래 & 관계사: 주관적 계획 미래 표현. 전치사 on의 목적어가 유실되어 목적격 관계대명사 that이 유도되었습니다.", words: "concentrate on (~에 집중하다), schoolwork (학업), catch up on (~을 따라잡다)", kor: "이번 주에 나는 내가 따라잡아야 할 학업에 집중할 예정이다." },
            { no: 295, unit: "UNIT 28", eng: "We are moving to a new place tomorrow.", struct: "We(S) + are moving(V) + [to a new place](M) [tomorrow](M)", grammar: "현재진행형의 미래 대용: 확정형 미래 부사(tomorrow)와 복합 작용하여 가까운 미래의 이사 일정을 확정 표기합니다.", words: "move (이사하다), place (장소)", kor: "우리는 내일 새로운 곳으로 이사할 것이다." },
            { no: 296, unit: "UNIT 28", eng: "A lot of people give up just before they’re about to achieve success.", struct: "A lot of people(S) + give up(V) + [just before they’re about to achieve success](M)", grammar: "be about to-v: '막 ~하려는 참이다'라는 바로 직전의 미래 시점을 긴박하게 묘사합니다.", words: "give up (포기하다), be about to (~막 하려고 하다), achieve (성취하다), success (성공)", kor: "많은 사람들이 그들이 막 성공을 이루어내기 직전에 포기한다." },
            { no: 297, unit: "UNIT 28", eng: "She was on the point of leaving when he finally arrived.", struct: "She(S) + was on the point of leaving(V) + [when he finally arrived](M)", grammar: "be on the point of -ing: 'be about to'와 대동소이하게 '막 ~하려는 찰나이다'를 유도하는 구문 시제입니다.", words: "on the point of (~하려던 찰나에), leave (떠나다), finally (마침내)", kor: "그가 마침내 도착했을 때 그녀는 막 떠나려던 참이었다." },
            { no: 298, unit: "UNIT 28", eng: "The plane for Toronto is to take off within 30 minutes.", struct: "The plane [for Toronto](S) + is to take off(V) + [within 30 minutes](M)", grammar: "be to 용법: 여기서는 공적인 스케줄에 따른 '미래의 예정' 상황을 전달하고 있습니다.", words: "take off (이륙하다), within (~이내에)", kor: "토론토행 비행기는 30분 이내에 이륙할 예정이다." },
            { no: 299, unit: "UNIT 28", eng: "The project is due to start on Monday and the duration will be three weeks.", struct: "The project(S1) + is due to start(V1) + and + the duration(S2) + will be(V2)", grammar: "be due to-v: '~할 예정이다'라는 고정 일정을 표명하는 시제 대용 숙어구입니다.", words: "due to-v (~할 예정인), duration (기간)", kor: "그 프로젝트는 월요일에 시작할 예정이며, 기간은 3주일 것이다." },

            // UNIT 29
            { no: 300, unit: "UNIT 29", eng: "People have wondered for centuries about life after death.", struct: "People(S) + have wondered(V) + [for centuries](M)", grammar: "현재완료 (계속): 'for centuries'라는 지속 기간 부사구의 유도로 계속적 개념을 표현합니다.", words: "wonder (궁금해하다), century (세기, 100년), life after death (사후 세계)", kor: "사람들은 사후 세계에 대해 수 세기 동안 궁금해해 왔다." },
            { no: 301, unit: "UNIT 29", eng: "We have been to Jeju Island many times.", struct: "We(S) + have been to(V) + Jeju Island(M) + [many times](M)", grammar: "현재완료 (경험): 'have been to'는 '~에 가본 적이 있다'. 'many times'와 연동되어 경험을 소명합니다.", words: "have been to (~에 가본 적이 있다), many times (여러 번)", kor: "우리는 제주도에 여러 번 가본 적이 있다." },
            { no: 302, unit: "UNIT 29", eng: "We have just been to Jeju Island for summer vacation.", struct: "We(S) + have [just] been to(V) + [for summer vacation](M)", grammar: "현재완료 (완료): 'just'가 쓰여 현재 기준 방금 막 동작이 종결되었음을 피력합니다.", words: "just (방금, 막), summer vacation (여름 휴가)", kor: "우리는 여름 휴가로 방금 제주도에 다녀왔다." },
            { no: 303, unit: "UNIT 29", eng: "South Africa has lost many natural habitats due to deforestation.", struct: "South Africa(S) + has lost(V) + many natural habitats(O)", grammar: "현재완료 (결과): 과거에 서식처를 상실하여 '그 결과 지금 상태가 그러하다'는 현재의 소치를 품습니다.", words: "natural habitat (자연 서식지), due to (~때문에), deforestation (삼림 파괴)", kor: "남아프리카공화국은 삼림 파괴로 인해 많은 자연 서식지를 잃어버렸다." },
            { no: 304, unit: "UNIT 29", eng: "Since 1985, the company has been in its present location.", struct: "[Since 1985](M), the company(S) + has been(V)", grammar: "현재완료 (계속): 'Since + 과거시점' 부사구가 명시되어 주절에 현재완료 계속성이 입증됩니다.", words: "since (~이래로), present (현재의), location (위치)", kor: "1985년 이래로 그 회사는 현재의 위치에 있어 왔다." },
            { no: 305, unit: "UNIT 29", eng: "It has been my lifelong dream to visit this beautiful city.", struct: "It(가S) + has been(V) + my lifelong dream(C) + [to visit...](진S)", grammar: "가주어-진주어 완료결합: 과거부터 지금까지 평생 품어온 오랜 소망 상태의 유지를 반사합니다.", words: "lifelong (평생의), visit (방문하다)", kor: "이 아름다운 도시를 방문하는 것은 나의 평생의 꿈이었다." },
            { no: 306, unit: "UNIT 29", eng: "Have you ever imagined your future?", struct: "Have(V) + you(S) + [ever] + imagined(V') + your future(O)?", grammar: "현재완료 의문문: 경험 유무의 단서가 되는 부사 'ever(~한 적이 있는가)'가 조동사 도치형에 수반되었습니다.", words: "imagine (상상하다), future (미래)", kor: "당신은 당신의 미래를 상상해 본 적이 있습니까?" },
            { no: 307, unit: "UNIT 29", eng: "The baseball team has never won a game so far this season.", struct: "The baseball team(S) + has [never] won(V) + a game(O) + [so far...](M)", grammar: "현재완료 (경험/계속): 절대 부정어 'never' 및 'so far'(지금까지)와의 호응으로 지속적 전적을 서술합니다.", words: "never (결코 ~않다), so far (지금까지)", kor: "그 야구팀은 이번 시즌 지금까지 단 한 경기도 이기지 못했다." },
            { no: 308, unit: "UNIT 29", eng: "She’s only twenty, but she’s already achieved worldwide fame.", struct: "She’s(is) only twenty, but + she’s(has) [already] achieved(V)", grammar: "축약형 변별: 앞의 She's는 She is(현재형 상태), 뒤의 she's는 she has(현재완료)의 축약형태입니다.", words: "achieve (성취하다), worldwide (세계적인), fame (명성)", kor: "그녀는 겨우 스무 살이지만, 이미 세계적인 명성을 얻었다." },
            { no: 309, unit: "UNIT 29", eng: "He has just become a member of Mensa, with an estimated IQ of 156.", struct: "He(S) + has [just] become(V) + a member of Mensa(C)", grammar: "현재완료 (완료): 'just'를 활용하여 아주 임박한 시점에 사건 상태가 완수 완료되었음을 확인합니다.", words: "become (~이 되다), estimated (추정되는), IQ (지능지수)", kor: "그는 추정 IQ 156으로 방금 멘사 회원이 되었다." },
            { no: 310, unit: "UNIT 29", eng: "My sister has gone to the bank. She should be back soon.", struct: "My sister(S) + has gone to(V) + the bank(M)", grammar: "현재완료 (결과): 'has gone to'는 '가고 여기 없다'는 단절을 주지하므로 1, 2인칭(I, You) 주어 기술이 불가합니다.", words: "have gone to (~로 가버렸다), bank (은행)", kor: "내 여동생은 은행에 갔다. 그녀는 곧 돌아올 것이다." },
            { no: 311, unit: "UNIT 29", eng: "Someone is sitting in the shade today because someone planted a tree a long time ago.", struct: "Someone(S1) + is sitting(V1) + [because someone(S2) planted(V2) a tree(O)](M)", grammar: "시제 대조: 주절은 현재진행(is sitting) 상황, 종속절은 명백한 과거사 부사(a long time ago)로 인해 단순과거(planted)가 대응합니다.", words: "shade (그늘), plant (심다), a long time ago (오래전에)", kor: "누군가가 오늘 그늘에 앉아 있다 왜냐하면 누군가가 오래전에 나무를 심었기 때문이다." },
            { no: 312, unit: "UNIT 29", eng: "N Seoul Tower has been a symbol of Seoul since it first opened to the public in 1980.", struct: "N Seoul Tower(S) + has been(V) + a symbol(C) + [since it opened...](M)", grammar: "since 복합문법: 종속절인 since 내부는 기점 과거시제(opened), 주절 문맥은 전체 수용 현재완료(has been)가 원칙입니다.", words: "symbol (상징), open to the public (대중에게 개방되다)", kor: "N서울타워는 1980년에 대중에게 처음 개방된 이래로 서울의 상징이어 왔다." },
            { no: 313, unit: "UNIT 29", eng: "The baby has been crying since we got here.", struct: "The baby(S) + has been crying(V) + [since we got here](M)", grammar: "현재완료 진행형: [have/has been + -ing] 구조로 과거 시점부터 현재 말하는 이 순간까지 '줄곧 울어왔음'을 역동적으로 부각합니다.", words: "cry (울다), get here (도착하다)", kor: "그 아기는 우리가 여기 도착한 이래로 계속 울고 있다." },
            { no: 314, unit: "UNIT 29", eng: "How long have you been looking for a job?", struct: "[How long](M) + have + you(S) + been looking for(V) + a job(O)?", grammar: "현재완료 진행 의문문: 구동사 'look for'가 완료진행 수동틀을 유지하며 구직의 행위 지속 기한을 취조합니다.", words: "how long (얼마나 오래), look for (~을 찾다), job (일자리)", kor: "당신은 얼마나 오랫동안 일자리를 구하고 있습니까?" },
            { no: 315, unit: "UNIT 29", eng: "I have been trying to solve this problem all afternoon. It’s time for a break.", struct: "I(S) + have been trying(V) + {to solve this problem}(O)", grammar: "현재완료 진행 & try 용법: 오후 내내(all afternoon) 지속된 사투를 보여줍니다. try to-v는 노력을 유발하는 명사적 부정사구입니다.", words: "try to-v (~하려고 애쓰다), solve (풀다), break (휴식)", kor: "나는 오후 내내 이 문제를 풀려고 애쓰는 중이다. 이제 좀 쉴 시간이다." },
            { no: 316, unit: "UNIT 29", eng: "The event has been taking place in the city on the first Saturday of May each year.", struct: "The event(S) + has been taking place(V)", grammar: "현재완료 진행: 정기적 규칙성(each year)이 부여되어 발생하는 역사 상태의 귀결도 완료진행으로 수립 가능합니다.", words: "take place (개최되다), each year (매년)", kor: "그 행사는 매년 5월 첫째 토요일에 그 도시에서 계속 열려오고 있다." },

            // UNIT 30
            { no: 317, unit: "UNIT 30", eng: "The pianist had been sick for two weeks, so she couldn’t take part in the concert.", struct: "The pianist(S1) + had been(V1) + sick(C1) + so + she(S2) + couldn’t take part in(V2)", grammar: "과거완료 (계속): 불참한 과거 기준점(couldn't)보다 그 이전에 2주간 앓았던 대과거 상태의 연속을 소묘합니다.", words: "sick (아픈), take part in (~에 참가하다), concert (콘서트)", kor: "그 피아니스트는 2주 동안 아팠었다, 그래서 그녀는 콘서트에 참가할 수 없었다." },
            { no: 318, unit: "UNIT 30", eng: "I recognized him at once because I had seen him before.", struct: "I(S1) + recognized(V1) + him(O1) + [because I(S2) + had seen(V2) + him before](M)", grammar: "과거완료 (대과거): 대상 인지 시점(recognized: 과거)보다, 그 이전에 목격한 경험(had seen: 대과거)이 연대기 상 앞서 일어났습니다.", words: "recognize (알아보다), at once (즉시), before (전에)", kor: "나는 그를 즉시 알아봤는데, 왜냐하면 그를 전에 본 적이 있었기 때문이다." },
            { no: 319, unit: "UNIT 30", eng: "When I entered the classroom, the lesson had already finished.", struct: "[When I entered...](M), the lesson(S) + had [already] finished(V)", grammar: "과거완료 (완료): 교실에 입실한 과거 타이밍(entered) 이전에 수업이 이미 조기 종결(had finished)되었음을 증명합니다.", words: "enter (들어가다), already (이미)", kor: "내가 교실에 들어갔을 때, 수업은 이미 끝나 있었다." },
            { no: 320, unit: "UNIT 30", eng: "Almost 11 minutes had gone by when the players finally stopped challenging the referee over his decision.", struct: "Almost 11 minutes(S) + had gone by(V) + [when the players stopped...](M)", grammar: "과거완료 & stop 용법: 항의 행위 정지 시점(stopped) 이전에 미터기 상 시간이 먼저 경과(had gone by)되었음을 고발합니다.", words: "go by (흘러가다), stop -ing (~를 멈추다), challenge (이의제기하다), referee (심판)", kor: "선수들이 마침내 심판의 판정에 항의하는 것을 멈추었을 때 거의 11분이 흘러가 버렸다." },
            { no: 321, unit: "UNIT 30", eng: "Carol prepared a gift for her mom, who had sacrificed all her life for her family.", struct: "Carol(S) + prepared(V) + a gift(O) [, who(주.관) had sacrificed(V')...](관계사 계속용법)", grammar: "과거완료 & 계속적 관계사: 준비를 행한 과거(prepared)보다 모친이 한평생 투쟁과 헌신을 감내한 누적 대과거 세월을 had p.p.로 승화합니다.", words: "prepare (준비하다), sacrifice (희생하다), all her life (평생 동안)", kor: "캐롤은 어머니를 위해 선물을 준비했는데, 어머니는 가족을 위해 평생을 희생하셨었다." },
            { no: 322, unit: "UNIT 30", eng: "She will have graduated from college by next month.", struct: "She(S) + will have graduated(V) + [from college] [by next month](M)", grammar: "미래완료: 미래 지향적 마감점 'by next month'의 제약과 맞물려 미래 도래 시 학위 취득이 완수될 것을 예언합니다.", words: "graduate from (~을 졸업하다), college (대학)", kor: "그녀는 다음 달이면 대학을 졸업하게 될 것이다." },
            { no: 323, unit: "UNIT 30", eng: "She will have taught English for ten years by next year.", struct: "She(S) + will have taught(V) + English(O) + [for ten years] [by next year](M)", grammar: "미래완료 (계속): 내년(by next year)이라는 이정표 시점에 도달 시 만 10년의 경력 수치가 자동 누적 성립됨을 뜻합니다.", words: "teach (가르치다), next year (내년)", kor: "내년이면 그녀는 영어를 가르친 지 10년이 될 것이다." },
            { no: 324, unit: "UNIT 30", eng: "If I see this film once more, I will have seen it three times.", struct: "[If I see...](조건절), I(S) + will have seen(V) + it(O) + [three times](M)", grammar: "미래완료 (경험): 조건절 내 미래 대용 현재시제(see). 주절은 차후 완수 시 누적 경험 카운트(three times)가 달성됨을 내다봅니다.", words: "film (영화), once more (한 번 더), three times (세 번)", kor: "만약 내가 이 영화를 한 번 더 본다면, 나는 그것을 세 번 보는 것이 될 것이다." },
            { no: 325, unit: "UNIT 30", eng: "We will have overcome differences if we respect them.", struct: "We(S) + will have overcome(V) + differences(O) + [if we respect them](조건절)", grammar: "미래완료: 상호 존중 조건을 총족할 시, 미래 시점에 완전한 화합 및 극복(overcome) 상태가 결실 맺음을 선언합니다.", words: "overcome (극복하다), difference (차이점), respect (존중하다)", kor: "만약 우리가 차이점들을 존중한다면, 우리는 차이점들을 극복하게 될 것이다." },

            // UNIT 31
            { no: 326, unit: "UNIT 31", eng: "I am very satisfied to have tried many kinds of sports last year.", struct: "I(S) + am(V) + satisfied(C) + [to have tried... last year](M)", grammar: "완료 부정사: 정서 상태 표출은 '현재(am)'이나, 스포츠 격투 활동은 '과거(last year)'. 본동사보다 시점이 앞서므로 to have p.p.를 장착합니다.", words: "satisfied (만족하는), try (시도하다), kind of (종류)", kor: "나는 작년에 많은 종류의 스포츠를 시도해 보았던 것에 매우 만족한다." },
            { no: 327, unit: "UNIT 31", eng: "He denied having made a serious mistake.", struct: "He(S) + denied(V) + {having made a serious mistake}(O)", grammar: "완료 동명사: 사건 부인 행동(denied: 과거)보다, 기정 과실 가해 사실이 시기상 앞선 선행 사건이기에 목적어 자리에 having p.p.가 배치됩니다.", words: "deny (부인하다), serious (심각한), mistake (실수)", kor: "그는 심각한 실수를 저질렀던 것을 부인했다." },
            { no: 328, unit: "UNIT 31", eng: "A farmer claimed to have seen a UFO in the sky.", struct: "A farmer(S) + claimed(V) + {to have seen...}(O)", grammar: "완료 부정사: 대외적 공식 주장(claimed: 과거)보다, 미확인 비행물체 실제 육안 목격 사건이 더 선행된 시간이므로 완료형 부정사 명사 목적어가 도출됩니다.", words: "claim (주장하다), sky (하늘)", kor: "한 농부는 하늘에서 UFO를 보았었다고 주장했다." },
            { no: 329, unit: "UNIT 31", eng: "It was helpful to have reviewed the book before I attended the history class.", struct: "It(가S) + was(V) + helpful(C) + {to have reviewed...}(진S)", grammar: "완료 부정사 주어: 이점을 획득한 과거 시제점(was)보다, 독서 예습 선행 활동이 시간의 기축 상 선행하므로 진주어에 완료 부정사를 씁니다.", words: "helpful (도움이 되는), review (복습하다), attend (참석하다)", kor: "내가 역사 수업에 참석하기 전에 그 책을 복습해 두었던 것은 도움이 되었다." },
            { no: 330, unit: "UNIT 31", eng: "Having failed once doesn’t mean that you’re going to fail at everything.", struct: "{Having failed once}(S) + doesn’t mean(V) + [that...](O)", grammar: "완료 동명사구 주어: 지목하는 현실 명제(doesn't mean: 현재)보다 과거 전력인 실패의 기록을 연계하므로 주어로 완료형 동명사가 성립되며 3인칭 단수 취급합니다.", words: "fail (실패하다), mean (의미하다), everything (모든 것)", kor: "한 번 실패했었다는 것이 당신이 모든 일에 실패할 것이라는 것을 의미하지는 않는다." },
            { no: 331, unit: "UNIT 31", eng: "I’m pretty proud of having completed a marathon myself.", struct: "I(S) + ’m proud of(V) + {having completed a marathon}(O)", grammar: "완료 동명사: 자랑스러워하는 심리는 '현재(am)'이나 레이스를 뛰어 마친 노고는 '과거'. 전치사 of의 목적어 시차가 성립되어 having p.p.가 쓰였습니다.", words: "pretty (꽤), proud of (~을 자랑스러워하는), complete (완주하다)", kor: "나는 마라톤을 스스로 완주해냈던 것이 꽤 자랑스럽다." },
            { no: 332, unit: "UNIT 31", eng: "John Bardeen is the only scientist to have received two Nobel Prizes in the Physics category.", struct: "John Bardeen(S) + is(V) + the only scientist(C) + [to have received...](M)", grammar: "형용사적 완료부정사: 불멸의 인물로 현재 등록된 지위(is) 대비, 과거사 수상 역사 기록(to have received)의 격차를 나타내는 형용사적 수식 구조입니다.", words: "scientist (과학자), receive (수상하다), physics (물리학), category (부문)", kor: "존 바딘은 물리학 부문에서 두 개의 노벨상을 받았던 유일한 과학자이다." }
        ];

        // 상태 변수
        let currentTab = "ALL";
        let activeMode = "study";
        let searchQuery = "";
        let filterOnlyBookmarks = false;
        
        let checkedCompleted = JSON.parse(localStorage.getItem('gramva_completed_v2')) || [];
        let bookmarkedList = JSON.parse(localStorage.getItem('gramva_bookmarks_v2')) || [];
        let writingNotes = JSON.parse(localStorage.getItem('gramva_notes_v2')) || {};

        let currentQuizIndex = 0;
        let quizQuestions = [];
        let modalConfirmCallback = null;

        window.onload = function() {
            renderTabs();
            renderCards();
            updateTotalProgress();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById("tabs-container");
            const units = ["ALL", "UNIT 27", "UNIT 28", "UNIT 29", "UNIT 30", "UNIT 31"];
            
            tabsContainer.innerHTML = "";
            units.forEach(unit => {
                const button = document.createElement("button");
                button.className = `px-4 py-1.5 rounded-full text-xs font-black transition-all shrink-0 whitespace-nowrap ${
                    currentTab === unit 
                    ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30" 
                    : "bg-slate-100 text-slate-500 hover:bg-slate-200"
                }`;
                button.innerText = unit === "ALL" ? "전체 목록" : unit;
                button.onclick = () => {
                    currentTab = unit;
                    if (activeMode !== "study") switchMode("study");
                    renderTabs();
                    renderCards();
                };
                tabsContainer.appendChild(button);
            });
        }

        // [리팩토링] 안전한 이벤트를 지향하는 카드 렌더링 카드 엔진
        function renderCards() {
            const cardsList = document.getElementById("cards-list");
            cardsList.innerHTML = "";

            const filtered = sentencesDb.filter(item => {
                const matchesTab = (currentTab === "ALL" || item.unit === currentTab);
                const matchesSearch = item.eng.toLowerCase().includes(searchQuery.toLowerCase()) || item.kor.includes(searchQuery);
                const matchesBookmark = !filterOnlyBookmarks || bookmarkedList.includes(item.no);
                return matchesTab && matchesSearch && matchesBookmark;
            });

            if (filtered.length === 0) {
                cardsList.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-slate-400 text-center">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
                        <p class="text-xs font-bold">조건에 부합하는 대상 구문이 없습니다.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const isCompleted = checkedCompleted.includes(item.no);
                const isBookmarked = bookmarkedList.includes(item.no);
                const savedNote = writingNotes[item.no] || "";

                const card = document.createElement("div");
                card.id = `card-${item.no}`;
                card.className = `bg-white rounded-2xl p-4 shadow-sm border ${
                    isCompleted ? 'border-emerald-200 bg-emerald-50/10' : 'border-slate-100'
                } flex flex-col space-y-3 transition-all relative duration-300`;

                card.innerHTML = `
                    <div class="flex justify-between items-center select-none">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-black bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-md">No. ${item.no}</span>
                            <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">${item.unit}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="speakText(${item.no})" class="text-slate-400 hover:text-indigo-600 transition-all p-1">
                                <i class="fa-solid fa-volume-high text-xs"></i>
                            </button>
                            <button onclick="toggleBookmark(${item.no})" class="transition-all p-1">
                                <i class="${isBookmarked ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star text-slate-300'} text-xs"></i>
                            </button>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleComplete(${item.no})" class="w-4.5 h-4.5 text-indigo-600 border-slate-300 rounded-md focus:ring-indigo-500 transition-all">
                                <span class="text-xs font-bold text-slate-400 select-none">완료</span>
                            </label>
                        </div>
                    </div>

                    <div onclick="speakText(${item.no})" class="text-base font-bold text-indigo-950 bg-indigo-50/40 p-3.5 rounded-xl border-l-4 border-indigo-500 leading-relaxed tracking-wide cursor-pointer hover:bg-indigo-50 active:scale-98 transition-all">
                        ${item.eng}
                    </div>

                    <div class="space-y-2">
                        <div class="border border-slate-100 rounded-xl overflow-hidden">
                            <button onclick="toggleAccordion(this)" class="w-full bg-slate-50 hover:bg-slate-100/80 px-3 py-2.5 flex justify-between items-center text-xs font-bold text-slate-600 transition-all">
                                <span class="flex items-center gap-1.5"><i class="fa-solid fa-code text-indigo-500"></i> 문장구조 & 핵심문법</span>
                                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform duration-200 accordion-icon"></i>
                            </button>
                            <div class="hidden p-3 bg-white border-t border-slate-50 text-xs space-y-2.5 leading-relaxed">
                                <div>
                                    <h4 class="font-extrabold text-indigo-600"><i class="fa-solid fa-network-wired"></i> 구문 공식 구조</h4>
                                    <code class="block mt-1 bg-slate-50 p-2 rounded-lg border border-slate-100 text-[11px] font-mono text-slate-700 select-all">${item.struct}</code>
                                </div>
                                <div class="text-slate-600">
                                    <h4 class="font-extrabold text-emerald-600"><i class="fa-solid fa-circle-info"></i> 핵심 문법 가이드</h4>
                                    <p class="mt-0.5">${item.grammar}</p>
                                </div>
                            </div>
                        </div>

                        <div class="border border-slate-100 rounded-xl overflow-hidden">
                            <button onclick="toggleAccordion(this)" class="w-full bg-slate-50 hover:bg-slate-100/80 px-3 py-2.5 flex justify-between items-center text-xs font-bold text-slate-600 transition-all">
                                <span class="flex items-center gap-1.5"><i class="fa-solid fa-spell-check text-amber-500"></i> 고난도 필수 단어장</span>
                                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform duration-200 accordion-icon"></i>
                            </button>
                            <div class="hidden p-3 bg-white border-t border-slate-50 text-xs">
                                <span class="inline-flex gap-1.5 text-slate-700 italic flex-wrap leading-relaxed font-semibold">
                                    ${item.words.split(', ').map(word => `<span class="bg-amber-50 text-amber-800 border border-amber-100 px-2 py-1 rounded-md">${word}</span>`).join('')}
                                </span>
                            </div>
                        </div>

                        <div class="border border-slate-100 rounded-xl overflow-hidden">
                            <button onclick="toggleAccordion(this)" class="w-full bg-indigo-50/20 hover:bg-indigo-50/50 px-3 py-2.5 flex justify-between items-center text-xs font-bold text-indigo-700 transition-all">
                                <span class="flex items-center gap-1.5"><i class="fa-solid fa-language"></i> 나만의 해석 연습장</span>
                                <i class="fa-solid fa-chevron-down text-[10px] text-indigo-400 transition-transform duration-200 accordion-icon"></i>
                            </button>
                            <div class="hidden p-3 bg-white border-t border-slate-50 space-y-3">
                                <div class="space-y-1.5">
                                    <textarea id="note-input-${item.no}" oninput="saveNote(${item.no}, this.value)" rows="2" placeholder="이곳에 직독직해를 직접 입력해보세요..." class="w-full p-2.5 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500 transition-all bg-slate-50 text-slate-700 font-medium">${savedNote}</textarea>
                                </div>
                                <div class="bg-emerald-50/80 border border-emerald-100 p-3 rounded-xl">
                                    <span class="text-[10px] font-black text-emerald-600 uppercase tracking-wider block mb-1">모범 한글 해석</span>
                                    <p class="text-xs font-bold text-slate-800 leading-relaxed">${item.kor}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                cardsList.appendChild(card);
            });
        }

        // [패치] 상대참조 기법을 사용한 범용 아코디언 애니메이터 (버그 원천 소멸)
        function toggleAccordion(button) {
            const content = button.nextElementSibling;
            const icon = button.querySelector(".accordion-icon");
            if (content.classList.contains("hidden")) {
                content.classList.remove("hidden");
                if (icon) icon.classList.add("rotate-180");
            } else {
                content.classList.add("hidden");
                if (icon) icon.classList.remove("rotate-180");
            }
        }

        // [패치] 시제 DB 룩업 캡슐화 연동형 발음 처리기 (작은따옴표 유실 완전 차단)
        function speakText(no) {
            const targetItem = sentencesDb.find(s => s.no === no);
            if (!targetItem) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(targetItem.eng);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                showModal("오디오 에러", "해당 브라우저 및 디바이스에서 TTS 오디오 출력을 지원하지 않습니다.", "fa-triangle-exclamation");
            }
        }

        document.getElementById("search-input").addEventListener("input", function(e) {
            searchQuery = e.target.value;
            renderCards();
        });

        function toggleBookmark(no) {
            const idx = bookmarkedList.indexOf(no);
            if (idx > -1) {
                bookmarkedList.splice(idx, 1);
            } else {
                bookmarkedList.push(no);
                showModal("보관함 추가", "해당 구문이 복습 북마크 보관함에 등록되었습니다.", "fa-circle-check");
            }
            localStorage.setItem('gramva_bookmarks_v2', JSON.stringify(bookmarkedList));
            renderCards();
            updateTotalProgress();
        }

        function toggleBookmarkFilter() {
            filterOnlyBookmarks = !filterOnlyBookmarks;
            const btn = document.getElementById("bookmark-filter-btn");
            const icon = document.getElementById("bookmark-filter-icon");
            if (filterOnlyBookmarks) {
                btn.classList.add("bg-indigo-600", "text-white");
                btn.classList.remove("bg-slate-100", "text-slate-500");
                icon.className = "fa-solid fa-star text-amber-300";
            } else {
                btn.classList.remove("bg-indigo-600", "text-white");
                btn.classList.add("bg-slate-100", "text-slate-500");
                icon.className = "fa-regular fa-star";
            }
            renderCards();
        }

        function toggleComplete(no) {
            const idx = checkedCompleted.indexOf(no);
            if (idx > -1) {
                checkedCompleted.splice(idx, 1);
            } else {
                checkedCompleted.push(no);
            }
            localStorage.setItem('gramva_completed_v2', JSON.stringify(checkedCompleted));
            renderCards();
            updateTotalProgress();
        }

        function saveNote(no, value) {
            writingNotes[no] = value;
            localStorage.setItem('gramva_notes_v2', JSON.stringify(writingNotes));
        }

        function updateTotalProgress() {
            const totalCount = sentencesDb.length;
            const checkedCount = checkedCompleted.length;
            const percent = Math.round((checkedCount / totalCount) * 100);
            
            document.getElementById("global-badge-stats").innerText = `${checkedCount}/${totalCount}`;
            document.getElementById("progress-percent").innerText = `${percent}%`;
            document.getElementById("progress-bar-fill").style.width = `${percent}%`;
        }

        function switchMode(mode) {
            activeMode = mode;
            const viewStudy = document.getElementById("view-study");
            const viewQuiz = document.getElementById("view-quiz");
            const navStudyIcon = document.getElementById("nav-study-icon");
            const navStudyText = document.getElementById("nav-study-text");
            const navQuizIcon = document.getElementById("nav-quiz-icon");
            const navQuizText = document.getElementById("nav-quiz-text");

            if (mode === "study") {
                viewStudy.classList.remove("hidden");
                viewQuiz.classList.add("hidden");
                navStudyIcon.className = "fa-solid fa-graduation-cap text-lg text-indigo-600";
                navStudyText.className = "text-[10px] font-bold text-indigo-600";
                navQuizIcon.className = "fa-solid fa-gamepad text-lg text-slate-400";
                navQuizText.className = "text-[10px] font-bold text-slate-400";
                renderCards();
            } else if (mode === "quiz") {
                viewStudy.classList.add("hidden");
                viewQuiz.classList.remove("hidden");
                navStudyIcon.className = "fa-solid fa-graduation-cap text-lg text-slate-400";
                navStudyText.className = "text-[10px] font-bold text-slate-400";
                navQuizIcon.className = "fa-solid fa-gamepad text-lg text-indigo-600";
                navQuizText.className = "text-[10px] font-bold text-indigo-600";
                startQuizSession();
            }
        }

        function startQuizSession() {
            currentQuizIndex = 0;
            let pool = sentencesDb;
            if (currentTab !== "ALL") {
                pool = sentencesDb.filter(i => i.unit === currentTab);
            }

            quizQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, 10);
            if (quizQuestions.length < 4) {
                quizQuestions = [...sentencesDb].sort(() => 0.5 - Math.random()).slice(0, 10);
                showModal("범위 자동 변경", "지정 단원의 문장 개수가 충족되지 않아 챕터 전체에서 퀴즈가 엄선되었습니다.", "fa-circle-info");
            }
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            const currentQ = quizQuestions[currentQuizIndex];
            
            document.getElementById("quiz-count").innerText = `${currentQuizIndex + 1}/${quizQuestions.length}`;
            document.getElementById("quiz-unit-badge").innerText = currentQ.unit;
            document.getElementById("quiz-no-badge").innerText = `No. ${currentQ.no}`;
            document.getElementById("quiz-question-english").innerText = currentQ.eng;

            document.getElementById("quiz-feedback").className = "hidden mt-4 p-3 rounded-xl text-center font-bold text-xs";
            document.getElementById("quiz-next-btn").classList.add("hidden");

            const correctKor = currentQ.kor;
            const wrongs = sentencesDb
                .filter(i => i.no !== currentQ.no)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3)
                .map(i => i.kor);

            const options = [correctKor, ...wrongs].sort(() => 0.5 - Math.random());
            const optionsContainer = document.getElementById("quiz-options");
            optionsContainer.innerHTML = "";

            options.forEach(opt => {
                const button = document.createElement("button");
                button.className = "w-full text-left p-3.5 bg-slate-50 hover:bg-indigo-50/50 border border-slate-200 hover:border-indigo-200 rounded-xl text-xs font-semibold leading-relaxed transition-all active:scale-[0.99] quiz-opt-btn";
                button.innerText = opt;
                button.onclick = () => selectQuizOption(button, opt, correctKor);
                optionsContainer.appendChild(button);
            });
        }

        function selectQuizOption(selectedBtn, chosenText, correctText) {
            const chess = document.querySelectorAll(".quiz-opt-btn");
            chess.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctText) {
                    btn.classList.add("bg-emerald-50", "border-emerald-300", "text-emerald-700");
                }
            });

            const feedback = document.getElementById("quiz-feedback");
            feedback.classList.remove("hidden");

            if (chosenText === correctText) {
                selectedBtn.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-700");
                feedback.innerText = "🎉 정답입니다! 훌륭한 구문 해석력입니다.";
                feedback.className = "block mt-4 p-3 rounded-xl text-center font-bold text-xs bg-emerald-100 text-emerald-800 border border-emerald-200";
            } else {
                selectedBtn.classList.add("bg-red-50", "border-red-400", "text-red-700");
                feedback.innerText = "😅 오답입니다. 오답 문장을 학습방에서 다시 확인하세요.";
                feedback.className = "block mt-4 p-3 rounded-xl text-center font-bold text-xs bg-red-100 text-red-800 border border-red-200";
            }
            document.getElementById("quiz-next-btn").classList.remove("hidden");
        }

        function speakQuizText() {
            const currentQ = quizQuestions[currentQuizIndex];
            speakText(currentQ.no);
        }

        function nextQuizQuestion() {
            if (currentQuizIndex < quizQuestions.length - 1) {
                currentQuizIndex++;
                loadQuizQuestion();
            } else {
                showModal("퀴즈 완주 달성", "성공적으로 모든 퀴즈 세션을 수료하셨습니다.", "fa-circle-check");
                switchMode("study");
            }
        }

        // [패치] 모바일 브라우저 먹통 현상을 막는 비동기식 커스텀 컨펌 대화 메커니즘
        function showCustomConfirm(title, msg, onConfirm) {
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-message").innerText = msg;
            document.getElementById("modal-icon").innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500"></i>`;
            
            const cancelBtn = document.getElementById("modal-cancel-btn");
            const confirmBtn = document.getElementById("modal-confirm-btn");
            
            cancelBtn.classList.remove("hidden");
            confirmBtn.className = "flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-md transition-all";
            confirmBtn.innerText = "확인";
            
            modalConfirmCallback = onConfirm;
            confirmBtn.onclick = function() {
                if (typeof modalConfirmCallback === "function") modalConfirmCallback();
                closeModal();
            };
            document.getElementById("custom-modal").classList.remove("hidden");
        }

        function showModal(title, msg, iconClass = "fa-circle-info") {
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-message").innerText = msg;
            document.getElementById("modal-icon").innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            document.getElementById("custom-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("custom-modal").classList.add("hidden");
            document.getElementById("modal-cancel-btn").classList.add("hidden");
            
            const confirmBtn = document.getElementById("modal-confirm-btn");
            confirmBtn.className = "w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition-all";
            confirmBtn.innerText = "확인";
            confirmBtn.onclick = closeModal;
            modalConfirmCallback = null;
        }

        // [패치] 모바일 차단 브레이크 해제형 초기화 모듈
        function resetAllProgress() {
            showCustomConfirm(
                "데이터 포맷", 
                "정말로 모든 학습 진도 상태와 작성 노트를 영구적으로 초기화하시겠습니까?", 
                function() {
                    checkedCompleted = [];
                    bookmarkedList = [];
                    writingNotes = {};
                    localStorage.removeItem('gramva_completed_v2');
                    localStorage.removeItem('gramva_bookmarks_v2');
                    localStorage.removeItem('gramva_notes_v2');
                    renderTabs();
                    renderCards();
                    updateTotalProgress();
                    
                    setTimeout(() => {
                        showModal("초기화 완료", "모든 로컬 학습 정보가 안전하게 제거되었습니다.", "fa-circle-check");
                    }, 150);
                }
            );
        }
    </script>
</body>
</html>
