<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 문장 분석 및 유사 문장 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-blue-500">SyntaxAI</h1>
            </div>
            <p class="text-sm text-slate-500 hidden sm:block">AI 기반 문장 구조 분석 & 유사 문장 생성</p>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <h2 class="text-lg font-semibold mb-4 text-slate-800">문장을 입력하세요</h2>
            <form id="analyzeForm" class="space-y-4">
                <div>
                    <textarea id="sentenceInput" rows="3" class="w-full p-4 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors resize-none text-lg" placeholder="분석하고 싶은 문장을 입력하세요. (예: The quick brown fox jumps over the lazy dog. 또는 나는 어제 도서관에서 재미있는 책을 읽었다.)" required></textarea>
                </div>
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="flex items-center gap-2">
                        <label for="languageSelect" class="text-sm font-medium text-slate-600">주요 언어:</label>
                        <select id="languageSelect" class="border border-slate-300 rounded-lg py-1.5 px-3 text-sm focus:ring-indigo-500 focus:border-indigo-500 text-slate-700">
                            <option value="auto">자동 감지 (Auto)</option>
                            <option value="ko">한국어 (Korean)</option>
                            <option value="en">영어 (English)</option>
                        </select>
                    </div>
                    
                    <button type="submit" id="submitBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-sm">
                        <span>분석 및 생성</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </section>

        <div id="loadingIndicator" class="hidden flex-col items-center justify-center py-12">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <p class="mt-4 text-slate-600 font-medium animate-pulse">AI가 문장을 분석하고 유사한 구조를 생성 중입니다...</p>
        </div>

        <div id="resultsContainer" class="hidden space-y-8 fade-in">
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Left Column: Analysis & Interpretation -->
                <div class="lg:col-span-2 space-y-6">
                    
                    <!-- Interpretation Section -->
                    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <h3 class="font-semibold text-slate-800">해석 및 의미</h3>
                        </div>
                        <div class="p-6">
                            <p id="interpretationText" class="text-slate-700 leading-relaxed text-lg"></p>
                        </div>
                    </section>

                    <!-- Structural Analysis Section -->
                    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                            <h3 class="font-semibold text-slate-800">문장 구조 분석</h3>
                        </div>
                        <div class="p-0 overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                                        <th class="py-3 px-6 font-medium w-1/4">성분 (Part)</th>
                                        <th class="py-3 px-6 font-medium w-1/4">어구 (Text)</th>
                                        <th class="py-3 px-6 font-medium w-1/2">설명 (Explanation)</th>
                                    </tr>
                                </thead>
                                <tbody id="analysisTableBody" class="divide-y divide-slate-100">
                                    <!-- Analysis rows will be inserted here -->
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>

                <!-- Right Column: Grammar Points -->
                <div class="space-y-6">
                    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden h-full">
                        <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            <h3 class="font-semibold text-slate-800">핵심 문법 포인트</h3>
                        </div>
                        <div class="p-6">
                            <ul id="grammarPointsList" class="space-y-3">
                                <!-- Grammar points will be inserted here -->
                            </ul>
                        </div>
                    </section>
                </div>
            </div>

            <!-- Similar Sentences Section -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-indigo-50 border-b border-indigo-100 px-6 py-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    <h3 class="font-semibold text-indigo-900">유사 구조 문장 생성</h3>
                    <span class="ml-auto text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full font-medium">AI Generated</span>
                </div>
                <div class="p-6 bg-slate-50/50">
                    <p class="text-sm text-slate-500 mb-6">입력하신 문장과 동일한 문법 구조를 가지지만 다른 단어를 사용하여 만든 문장들입니다. 구조를 익히는 데 도움이 됩니다.</p>
                    <div id="similarSentencesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Similar sentences will be inserted here -->
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- Error Toast -->
    <div id="errorToast" class="fixed bottom-4 right-4 bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-lg hidden z-50 transition-opacity duration-300 opacity-0">
        <div class="flex items-center">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p id="errorMessage" class="font-medium"></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('analyzeForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultsContainer = document.getElementById('resultsContainer');
        const errorToast = document.getElementById('errorToast');
        const errorMessage = document.getElementById('errorMessage');

        // Result Elements
        const interpretationText = document.getElementById('interpretationText');
        const analysisTableBody = document.getElementById('analysisTableBody');
        const grammarPointsList = document.getElementById('grammarPointsList');
        const similarSentencesContainer = document.getElementById('similarSentencesContainer');

        const API_KEY = ""; // Provided by environment
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${API_KEY}`;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const sentence = document.getElementById('sentenceInput').value.trim();
            const language = document.getElementById('languageSelect').value;

            if (!sentence) return;

            // UI State updates
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            loadingIndicator.classList.remove('hidden');
            loadingIndicator.classList.add('flex');
            resultsContainer.classList.add('hidden');
            hideError();

            try {
                const analysisData = await analyzeSentence(sentence, language);
                renderResults(analysisData);
                resultsContainer.classList.remove('hidden');
                // Scroll to results smoothly
                resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } catch (error) {
                console.error("Analysis Error:", error);
                showError(error.message || "문장 분석 중 오류가 발생했습니다. 다시 시도해 주세요.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                loadingIndicator.classList.add('hidden');
                loadingIndicator.classList.remove('flex');
            }
        });

        async function analyzeSentence(sentence, languagePref) {
            
            let langContext = "The user has not specified a language, auto-detect it.";
            if (languagePref === 'ko') langContext = "The primary language is Korean.";
            if (languagePref === 'en') langContext = "The primary language is English.";

            const systemInstruction = `
            You are an expert linguist, grammar teacher, and natural language parser.
            Your task is to analyze a given sentence, explain its grammatical structure, provide a clear interpretation/translation, and generate new sentences that strictly follow the exact same grammatical structure (syntax tree) but use different vocabulary.
            
            Context: ${langContext}
            If the input is English, provide explanations in Korean. If the input is Korean, provide explanations in Korean.

            You MUST respond in valid JSON format matching the requested schema exactly.
            Break down the 'analysis' finely into Subject, Verb, Object, Modifiers, Clauses, etc.
            `;

            const payload = {
                contents: [{ parts: [{ text: `Analyze this sentence: "${sentence}"` }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            analysis: {
                                type: "ARRAY",
                                description: "Detailed syntactic breakdown of the sentence into components.",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        part: { type: "STRING", description: "Grammatical role e.g., 주어(Subject), 동사(Verb), 수식어(Modifier), 부사구(Adverbial Phrase)" },
                                        text: { type: "STRING", description: "The exact substring from the sentence" },
                                        explanation: { type: "STRING", description: "Detailed explanation of what this part does in the sentence" }
                                    },
                                    required: ["part", "text", "explanation"]
                                }
                            },
                            interpretation: {
                                type: "STRING",
                                description: "Clear, natural translation and overall meaning of the sentence."
                            },
                            grammarPoints: {
                                type: "ARRAY",
                                items: { type: "STRING" },
                                description: "List of 2-4 key grammar rules, tenses, or idioms used in the sentence."
                            },
                            similarSentences: {
                                type: "ARRAY",
                                description: "Generate exactly 3 sentences that have the identical grammatical structure but different words.",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        sentence: { type: "STRING", description: "The newly generated sentence." },
                                        meaning: { type: "STRING", description: "Translation of the generated sentence." },
                                        difference: { type: "STRING", description: "Briefly explain how the vocabulary was changed while keeping the structure." }
                                    },
                                    required: ["sentence", "meaning", "difference"]
                                }
                            }
                        },
                        required: ["analysis", "interpretation", "grammarPoints", "similarSentences"]
                    }
                }
            };

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (!textResponse) {
                throw new Error("API로부터 유효한 응답을 받지 못했습니다.");
            }

            try {
                return JSON.parse(textResponse);
            } catch (e) {
                console.error("JSON Parsing Error on string:", textResponse);
                throw new Error("응답 데이터를 파싱하는 데 실패했습니다.");
            }
        }

        function renderResults(data) {
            // 1. Interpretation
            interpretationText.textContent = data.interpretation || "해석을 불러올 수 없습니다.";

            // 2. Structural Analysis Table
            analysisTableBody.innerHTML = '';
            if (data.analysis && data.analysis.length > 0) {
                data.analysis.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    // Add subtle background color alternating for readability
                    if (index % 2 === 0) tr.classList.add('bg-white');
                    else tr.classList.add('bg-slate-50/50');
                    
                    tr.innerHTML = `
                        <td class="py-4 px-6 text-sm font-semibold text-indigo-700 whitespace-nowrap align-top">${escapeHtml(item.part)}</td>
                        <td class="py-4 px-6 text-sm font-medium text-slate-900 bg-yellow-50/30 align-top">"${escapeHtml(item.text)}"</td>
                        <td class="py-4 px-6 text-sm text-slate-600 align-top leading-relaxed">${escapeHtml(item.explanation)}</td>
                    `;
                    analysisTableBody.appendChild(tr);
                });
            } else {
                analysisTableBody.innerHTML = `<tr><td colspan="3" class="py-4 px-6 text-center text-slate-500">분석 결과가 없습니다.</td></tr>`;
            }

            // 3. Grammar Points
            grammarPointsList.innerHTML = '';
            if (data.grammarPoints && data.grammarPoints.length > 0) {
                data.grammarPoints.forEach(point => {
                    const li = document.createElement('li');
                    li.className = "flex items-start gap-3";
                    li.innerHTML = `
                        <span class="mt-1 flex-shrink-0 w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                        <span class="text-sm text-slate-700 leading-relaxed">${escapeHtml(point)}</span>
                    `;
                    grammarPointsList.appendChild(li);
                });
            } else {
                grammarPointsList.innerHTML = `<li class="text-sm text-slate-500">핵심 문법 포인트가 없습니다.</li>`;
            }

            // 4. Similar Sentences
            similarSentencesContainer.innerHTML = '';
            if (data.similarSentences && data.similarSentences.length > 0) {
                data.similarSentences.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group";
                    
                    // Decorative number
                    const numberLabel = document.createElement('div');
                    numberLabel.className = "absolute -right-4 -top-4 w-12 h-12 bg-indigo-50 rounded-full flex items-end justify-start p-2 text-indigo-200 font-bold text-xl group-hover:bg-indigo-100 group-hover:text-indigo-300 transition-colors";
                    numberLabel.innerText = index + 1;
                    card.appendChild(numberLabel);

                    card.innerHTML += `
                        <div class="relative z-10">
                            <h4 class="font-bold text-slate-800 text-lg mb-2 mr-6">${escapeHtml(item.sentence)}</h4>
                            <p class="text-slate-600 text-sm mb-4 pb-4 border-b border-slate-100">${escapeHtml(item.meaning)}</p>
                            <div class="flex items-start gap-2">
                                <svg class="w-4 h-4 text-emerald-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                <p class="text-xs text-slate-500 leading-tight"><strong>변화:</strong> ${escapeHtml(item.difference)}</p>
                            </div>
                        </div>
                    `;
                    similarSentencesContainer.appendChild(card);
                });
            } else {
                 similarSentencesContainer.innerHTML = `<p class="text-sm text-slate-500 col-span-full">유사 문장을 생성하지 못했습니다.</p>`;
            }
        }

        // Utility: Escape HTML to prevent XSS
        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Utility: Error Handling UI
        function showError(msg) {
            errorMessage.textContent = msg;
            errorToast.classList.remove('hidden');
            // Small delay to allow display:block to apply before changing opacity for transition
            setTimeout(() => {
                errorToast.classList.remove('opacity-0');
            }, 10);
            
            setTimeout(hideError, 5000);
        }

        function hideError() {
            errorToast.classList.add('opacity-0');
            setTimeout(() => {
                errorToast.classList.add('hidden');
            }, 300);
        }

    </script>
</body>
</html>
